# 本地开发 / 自定义部署用编排（非飞牛）
# 飞牛用户推荐直接用 .fpk 安装（内部已内置等价 compose）。
#
# 单容器单体程序：测速（cfnb 引擎）+ 写入 AdGuard Home
# + 推送四家 DNS 服务商 + 统一后台界面，全部在一个进程、一个端口、一个数据目录里。
#
# 首次启动后浏览器打开 http://<本机IP>:8080 ，所有配置都在界面里填，
# 不需要手工编辑任何文件。
services:
  cf-ddns-sidecar:
    # 自建镜像：docker build -t yourname/cf-ddns-sidecar:latest .
    image: ${SIDECAR_IMAGE:-your-dockerhub-username/cf-ddns-sidecar:latest}
    container_name: cf-ddns-sidecar
    restart: unless-stopped
    # 用 host 网络：端口由程序按 ddns.env 的 CFDDNS_PORT 监听（默认 8080），
    # 改端口不用重建容器；同时避免测速受 NAT 影响。
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      # 后台登录密码。留空则读数据目录下的 dashboard-password；
      # 两者都没有时，程序会自动生成一个并打印在启动日志里（不会免登录）。
      # DSA_PASSWORD: "改成你自己的密码"
    volumes:
      # 一个目录装下全部：config.json、ddns.env、dashboard-password、测速工作目录
      - ./data:/app/data
