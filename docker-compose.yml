# 本地开发 / 自定义部署用编排
# 飞牛用户推荐直接用 .fpk 安装（内部已内置等价 compose）。
services:
  # ===== 主体：测速 + 写入 AdGuard Home =====
  cf-dns-select:
    image: ghcr.io/neon9809/cf-dns-select:latest
    container_name: cf-dns-select
    restart: unless-stopped
    network_mode: host
    environment:
      DSA_ALLOWED_CIDRS: "192.168.0.0/23"   # 改成你的局域网网段
      DSA_COLO_IP_DB: /app/data/colo_ip_db.json
      TZ: Asia/Shanghai
    volumes:
      - ./subject-data:/app/data              # 主体的 config.json 写在这里

  # ===== 旁路：读取最优 IP 并推送 DDNS =====
  # 运行前先：cp .env.example .env 并填入密钥；cp config.yaml.example config/config.yaml
  ddns-sidecar:
    image: ${SIDECAR_IMAGE:-your-dockerhub-username/cf-ddns-sidecar:latest}
    container_name: cf-ddns-sidecar
    restart: unless-stopped
    depends_on:
      - cf-dns-select
    ports:
      - "18080:8080"                          # 健康检查端口，按需改
    env_file:
      - .env                                  # 存放各家 API 密钥
    volumes:
      - ./config:/app/config:ro                # config.yaml
      - ./sidecar-data:/app/data               # 自身状态持久化
      - ./subject-data:/app/subject:ro         # 只读挂载主体的 config.json
    command: ["-c", "/app/config/config.yaml"]
