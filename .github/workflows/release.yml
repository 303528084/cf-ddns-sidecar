name: Build & Release

# 打 tag（如 v1.0.0）推送后触发：
#   1) buildx 构建 amd64 + arm64 镜像并推送 DockerHub
#   2) 用 fnpack 打包飞牛 .fpk
#   3) 创建 GitHub Release，仅上传 .fpk 文件
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（X.Y.Z）"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cf-ddns-sidecar

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V / 镜像tag: v$V"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: 安装 fnpack
        env:
          FNPACK_URL: ${{ vars.FNPACK_URL }}
        run: |
          set -e
          URL="${FNPACK_URL:-https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64}"
          echo "下载 fnpack: $URL"
          curl -fsSL "$URL" -o fnpack || {
            echo "::error::fnpack 下载失败。请在仓库 Settings → Variables 设置 FNPACK_URL 为官方 static2.fnnas.com 直链。"
            exit 1
          }
          # 校验是真实 Linux ELF 二进制，防止下载到 HTML 错误页
          file fnpack | grep -q "ELF" || {
            echo "::error::fnpack 不是有效的 Linux 可执行文件（非 ELF），请检查 FNPACK_URL。"
            exit 1
          }
          chmod +x fnpack
          ./fnpack build --help

      - name: 打包飞牛 FPK
        env:
          DOCKERHUB_REPO: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.ver.outputs.tag }}
          FPK_VERSION: ${{ steps.ver.outputs.version }}
          FNPACK_BIN: ${{ github.workspace }}/fnpack
        run: python3 scripts/build_fpk.py

      - name: 列出产物
        run: ls -lh dist-fpk/

      - name: 创建 GitHub Release 并仅上传 FPK
        uses: softprops/action-gh-release@v2
        with:
          # 用已解析的 tag（vX.Y.Z），确保 workflow_dispatch 手动触发时
          # 不会把 Release 错误地挂到分支名上。
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "v${{ steps.ver.outputs.version }}"
          body: |
            ## Cloudflare 优选 IP + AdGuard Home + DDNS（飞牛 fnOS）

            一个容器、一个后台，搞定三件事：测出你家网络**真能连上**的最快 Cloudflare 节点、
            写进 AdGuard Home 的 DNS 重写、同步到自有域名的解析记录。

            - **测速**：官方地址段随机采样 + 多源聚合 → TCP 筛延迟 → 反代验证（真实 HTTPS + TLS）
              → 真实带宽测速。内置 Cloudflare 官方 IPv4 段快照，第三方源全挂也能跑出结果。
            - **AdGuard Home**：把最优 IP 写进 DNS 重写表，局域网设备自动走这条线。
            - **DDNS**：Cloudflare / 阿里云 / 腾讯云 DNSPod / 华为云 四家可选，
              只写最快那条、或者按排名一次写前 N 条（条数自己定），TTL 和云朵开关都能设。
            - **后台**：`http://飞牛IP:端口`，端口在安装向导里填（留空 = 8080），
              配置全在界面里填，不用编辑任何文件。

            本 Release 仅提供飞牛应用安装包 `.fpk`。
            Docker 镜像（amd64/arm64）已推送至 DockerHub：`${{ env.IMAGE_NAME }}`。

            ### v1.3.1：升级再也不靠运气——备份搬到了应用目录外面，装完自己恢复

            这不是「又加了个功能」，是修一次真实事故：v1.3.0 装完，后台里 AdGuard 地址、
            域名、各家密钥全空了，最后是用户靠升级前自己导出的 json 救回来的。

            **问题出在哪**
            飞牛覆盖升级时会删掉整个 `/var/apps/cf-ddns-sidecar` 目录。v1.1.1 加的
            「升级前自动备份」写的是 `share/cf-ddns-sidecar-backup-<时间>/`，
            **还在这条路径里面**——平台把整层删了，备份跟着一起没了。
            等于把保险柜放在要拆的楼里。

            **这一版改了三处**

            1. **备份搬到 `/var/apps/cf-ddns-sidecar-backup/<时间>/`**，是应用目录的
               **兄弟**，不在它里面；整层被删也活着。保留最近 3 份，不占地方。
            2. **装完程序自己恢复**：启动时发现数据目录是空的、而备份还在，就把
               `config.json`、`ddns.env`、后台密码、向导标记四个文件搬回来——
               端口、后台密码、AdGuard 地址、域名、同步几条 IP、各家密钥全在里面，
               不需要你手动导入。
            3. **恢复过就在后台顶上挂红条**，写清「从哪个备份捡回来的」，
               你核对完点一次「保存全部设置」它才消失。**不做静默恢复**：
               捡回来的配置看起来和正常的一模一样，不说的话你会以为升级一切顺利。

            > 只在真的空了的时候才动手：数据目录里已经有 `config.json` 就一条都不碰。
            > 备份目录也是只读挂载的，程序只读不写。

            ### 升级前请看

            - **从任何旧版本升上来都会先自动备份一次**，你不用做任何准备。
              万一平台这次还是把东西删了，装完打开后台就是升级前的样子，顶上会挂一条红条。
            - **卸载应用不会删掉 `/var/apps/cf-ddns-sidecar-backup`**，
              想彻底清干净要自己去文件管理里删这个目录。
            - **装完请把后台密码换成强密码（8 位以上）。** 这个后台对所有 IP 开放，
              而「立即更新一次」能直接改你的域名解析。
            - 从 v1.1.0 及更早往上升：先看下面 v1.1.1 那节，那一版才修掉
              「卸载脚本删数据」。

            ### 历史版本要事（v1.3.0）

            v1.3.0 加了三个域名解析相关的设置，都还能用：一次按排名写多个 IP
            （「填几条，这个域名下就只留几条」，是**对齐**不是追加；测不出 IP 时
            一条都不删）、记录缓存时间 TTL 自己填、Cloudflare 云朵开关（默认关、
            建议保持关，开了就不指向优选 IP 了）。

            ### 历史版本要事（v1.1.1）

            v1.1.1 修了一个会弄丢全部配置的问题：卸载脚本里有一段 `rm -rf` 数据目录
            （本意是卸载后别留空文件夹），而飞牛的升级流程在部分版本上走「卸旧装新」，
            于是它在升级时被执行了。三处一起改才闭环：卸载不再删数据、
            升级前备份到数据目录**同级**（整层被删也能活）、程序自己留 `.bak` 并能恢复。
            已被清空的配置无法找回，需要重新填一次。

            ### 历史版本要事（v1.1.0，放公网前必看）

            如果你打算把这个后台放到公网（Cloudflare Tunnel 或反向代理），
            v1.1.0 堵上了三个会变成漏洞的地方：登录失败限流（连错 5 次锁 5 分钟，
            之后每轮翻倍、最长 1 小时）、堵住候选列表接口的「本机免登录」口子
            （挂上隧道后所有请求在程序眼里都来自本机）、补上安全响应头
            （**刻意不加 `X-Frame-Options`**，因为飞牛桌面用 iframe 嵌入本后台，
            禁了会让图标点开一片白）。

            > 附带：会话 Cookie 的 `Secure` 改为只在 HTTPS 下添加。HTTP 下带这个标记
            > 浏览器会直接丢弃，表现为「提示登录成功，但下一个请求又说未登录」。

            ### 安装

            1. 下载下方 `.fpk`；
            2. 飞牛桌面 → 应用中心 → 右上角设置 → **手动安装应用** → 选择该文件；
            3. **安装过程中会弹出「后台访问」向导**：填后台端口（留空 = 8080）+ 登录密码
               （留空则自动生成并打印在运行日志里）。
               域名、服务商和密钥装完在后台界面里填——那里的表单会显示当前值，不会误覆盖。

            ### 端口改了但点图标打不开？

            v1.0.1 起已修：桌面入口的端口改成占位符，会自动跟随你设的值；
            更老的飞牛版本则由程序启动时兜底纠正一次。若仍出现，重启一次应用即可。

            ### 如果你装过更早的内测版

            请**先彻底卸载再重新安装**。早期版本存在「安装时填的端口/密码不生效」的问题，
            修复已经内置在这一版里，重装一次即可彻底干净。卸载会一并清掉容器、镜像和数据目录。

            > 版本号说明：早期发布过一段 `3.0.x` 的内测版本号，现已全部撤下并重置。
            > 现在按 `1.0.x → 1.1.x` 正常递增——数字比 `3.0.x` 小，但内容更新。

            > 测速必须直连。程序已强制直连（清空所有 `*_PROXY`）。
            > 若路由器做了全局透明代理，需给 NAS 放行直连，否则测速结果会失真。
          files: |
            dist-fpk/*.fpk
          fail_on_unmatched_files: true
