name: Build & Release

# 打 tag（如 v1.0.0）推送后触发：
#   1) buildx 构建 amd64 + arm64 镜像并推送 DockerHub
#   2) 用 fnpack 打包飞牛 .fpk
#   3) 创建 GitHub Release，仅上传 .fpk 文件
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（X.Y.Z）"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cf-ddns-sidecar

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V / 镜像tag: v$V"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: 安装 fnpack
        env:
          FNPACK_URL: ${{ vars.FNPACK_URL }}
        run: |
          set -e
          URL="${FNPACK_URL:-https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64}"
          echo "下载 fnpack: $URL"
          curl -fsSL "$URL" -o fnpack || {
            echo "::error::fnpack 下载失败。请在仓库 Settings → Variables 设置 FNPACK_URL 为官方 static2.fnnas.com 直链。"
            exit 1
          }
          # 校验是真实 Linux ELF 二进制，防止下载到 HTML 错误页
          file fnpack | grep -q "ELF" || {
            echo "::error::fnpack 不是有效的 Linux 可执行文件（非 ELF），请检查 FNPACK_URL。"
            exit 1
          }
          chmod +x fnpack
          ./fnpack build --help

      - name: 打包飞牛 FPK
        env:
          DOCKERHUB_REPO: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.ver.outputs.tag }}
          FPK_VERSION: ${{ steps.ver.outputs.version }}
          FNPACK_BIN: ${{ github.workspace }}/fnpack
        run: python3 scripts/build_fpk.py

      - name: 列出产物
        run: ls -lh dist-fpk/

      - name: 创建 GitHub Release 并仅上传 FPK
        uses: softprops/action-gh-release@v2
        with:
          # 用已解析的 tag（vX.Y.Z），确保 workflow_dispatch 手动触发时
          # 不会把 Release 错误地挂到分支名上。
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "v${{ steps.ver.outputs.version }}"
          body: |
            ## Cloudflare 优选 IP + AdGuard Home + DDNS（飞牛 fnOS）

            一个容器、一个后台，搞定三件事：测出你家网络**真能连上**的最快 Cloudflare 节点、
            写进 AdGuard Home 的 DNS 重写、同步到自有域名的解析记录。

            - **测速**：官方地址段随机采样 + 多源聚合 → TCP 筛延迟 → 反代验证（真实 HTTPS + TLS）
              → 真实带宽测速。内置 Cloudflare 官方 IPv4 段快照，第三方源全挂也能跑出结果。
            - **AdGuard Home**：把最优 IP 写进 DNS 重写表，局域网设备自动走这条线。
            - **DDNS**：Cloudflare / 阿里云 / 腾讯云 DNSPod / 华为云 四家可选。
            - **后台**：`http://飞牛IP:端口`，端口在安装向导里填（留空 = 8080），
              配置全在界面里填，不用编辑任何文件。

            本 Release 仅提供飞牛应用安装包 `.fpk`。
            Docker 镜像（amd64/arm64）已推送至 DockerHub：`${{ env.IMAGE_NAME }}`。

            ### v1.1.1 修复：升级一次，配置丢光

            这个版本修一个会把用户配置整个弄丢的问题，**建议所有 v1.1.0 及更早的用户升级**。

            **发生了什么**：从 v1.0.1 直接升级到 v1.1.0（不是卸载重装）后，后台里的
            AdGuard 地址、要加速的域名、各家 DNS 密钥全部变回默认值。程序启动日志显示
            `ddns.env`、`dashboard-password`、`.wizard-env-applied` 三个文件同时不存在
            ——数据目录被整个清空了。
            密码看起来还在，是因为飞牛把上次安装向导的答案又传了一遍、程序用这个值
            重新写了密码文件；而域名和密钥不在向导里，就真丢了。

            **原因**：卸载脚本里有一段 `rm -rf` 数据目录（本意是卸载后别在「文件管理」
            里留个空文件夹），而飞牛的升级流程在部分版本上走的是「卸旧装新」，于是这段
            清理逻辑在升级时被执行了。这个取舍当时做错了。

            **三处一起改，才闭环**：

            1. **卸载不再删数据**：`uninstall_callback` 只清容器，绝不动文件。
               要彻底清空请到「文件管理」里手动删共享文件夹。
            2. **升级前自动备份**：`upgrade_init` 在升级开始前把
               `config.json` / `ddns.env` / `dashboard-password` 复制到
               `share/cf-ddns-sidecar-backup-<时间>/`（数据目录的**同级**，
               这样即使 `share/cf-ddns-sidecar` 整层被删，备份也能活下来），
               只保留最近 3 份。
            3. **程序自己能爬起来**：每次写 `config.json` 前留一份 `.bak`；
               启动时若主文件不在了、`.bak` 还在，就自动恢复，并在运行日志里
               打一条 `[警告] config.json 不见了，已从 config.json.bak 恢复`。
               这一条不依赖平台什么时候调哪个脚本，是最后一道保险。

            > 已经被清空的配置无法找回，需要重新填一次。
            > 如果你给存储空间开过快照，可以去「存储管理 → 快照」看看有没有升级前的时间点。

            ### v1.1.0 新增：暴露到公网前的三处加固

            如果你打算把这个后台放到公网（比如用 Cloudflare Tunnel 或反向代理），
            这一版把三个会变成漏洞的地方堵上了：

            1. **登录失败限流**：同一个来源连错 5 次密码后锁定 5 分钟，
               之后每再错一轮锁定时间翻倍，最长 1 小时；登录成功立刻解锁。
               在此之前的版本只有 0.5 秒延时，并发爆破几分钟就能猜中弱密码。
            2. **堵上「本机免登录」口子**：测速用的候选列表接口原本只判来源 IP 是不是
               本机。挂上隧道或反向代理后，所有外部请求在程序眼里都来自本机，
               等于该接口对全网敞开。现在额外要求「没有任何转发头」才放行，
               已登录的用户不受影响。
            3. **安全响应头**：补上 `nosniff` 与 `Referrer-Policy`，并加上 CSP。
               注意这里**刻意不加 `X-Frame-Options`**——飞牛桌面是用 iframe 嵌入本后台的，
               禁止嵌入会让桌面图标点开一片白。

            附带：会话 Cookie 的 `Secure` 改为只在 HTTPS 连接下添加。
            HTTP 连接下带这个标记，浏览器会直接丢弃 Cookie，表现为
            「提示登录成功，但下一个请求又说未登录」。

            > 直连（局域网内用 `http://IP:端口`）的用法完全不受影响。

            ### 安装

            1. 下载下方 `.fpk`；
            2. 飞牛桌面 → 应用中心 → 右上角设置 → **手动安装应用** → 选择该文件；
            3. **安装过程中会弹出「后台访问」向导**：填后台端口（留空 = 8080）+ 登录密码
               （留空则自动生成并打印在运行日志里）。
               域名、服务商和密钥装完在后台界面里填——那里的表单会显示当前值，不会误覆盖。

            ### 端口改了但点图标打不开？

            v1.0.1 起已修：桌面入口的端口改成占位符，会自动跟随你设的值；
            更老的飞牛版本则由程序启动时兜底纠正一次。若仍出现，重启一次应用即可。

            ### 如果你装过更早的内测版

            请**先彻底卸载再重新安装**。早期版本存在「安装时填的端口/密码不生效」的问题，
            修复已经内置在这一版里，重装一次即可彻底干净。卸载会一并清掉容器、镜像和数据目录。

            > 版本号说明：早期发布过一段 `3.0.x` 的内测版本号，现已全部撤下并重置。
            > 现在按 `1.0.x → 1.1.x` 正常递增——数字比 `3.0.x` 小，但内容更新。

            > 测速必须直连。程序已强制直连（清空所有 `*_PROXY`）。
            > 若路由器做了全局透明代理，需给 NAS 放行直连，否则测速结果会失真。
          files: |
            dist-fpk/*.fpk
          fail_on_unmatched_files: true
