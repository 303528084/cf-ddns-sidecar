name: Build & Release

# 打 tag（如 v1.0.0）推送后触发：
#   1) buildx 构建 amd64 + arm64 镜像并推送 DockerHub
#   2) 用 fnpack 打包飞牛 .fpk
#   3) 创建 GitHub Release，仅上传 .fpk 文件
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（X.Y.Z）"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cf-ddns-sidecar

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V / 镜像tag: v$V"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        # 发版说明：通用介绍固定，下面 body 只写「当前版」一节。
        # 以后发版只替换 ### 那一节，不要把历史版本堆进来（旧说明留在各自 Release 页）。
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: 安装 fnpack
        env:
          FNPACK_URL: ${{ vars.FNPACK_URL }}
        run: |
          set -e
          URL="${FNPACK_URL:-https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64}"
          echo "下载 fnpack: $URL"
          curl -fsSL "$URL" -o fnpack || {
            echo "::error::fnpack 下载失败。请在仓库 Settings → Variables 设置 FNPACK_URL 为官方 static2.fnnas.com 直链。"
            exit 1
          }
          # 校验是真实 Linux ELF 二进制，防止下载到 HTML 错误页
          file fnpack | grep -q "ELF" || {
            echo "::error::fnpack 不是有效的 Linux 可执行文件（非 ELF），请检查 FNPACK_URL。"
            exit 1
          }
          chmod +x fnpack
          ./fnpack build --help

      - name: 打包飞牛 FPK
        env:
          DOCKERHUB_REPO: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.ver.outputs.tag }}
          FPK_VERSION: ${{ steps.ver.outputs.version }}
          FNPACK_BIN: ${{ github.workspace }}/fnpack
        run: python3 scripts/build_fpk.py

      - name: 列出产物
        run: ls -lh dist-fpk/

      - name: 创建 GitHub Release 并仅上传 FPK
        uses: softprops/action-gh-release@v2
        with:
          # 用已解析的 tag（vX.Y.Z），确保 workflow_dispatch 手动触发时
          # 不会把 Release 错误地挂到分支名上。
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "v${{ steps.ver.outputs.version }}"
          body: |
            ## Cloudflare 优选 IP + AdGuard Home + DDNS（飞牛 fnOS）

            一个容器、一个后台，搞定三件事：测出你家网络**真能连上**的最快 Cloudflare 节点、
            写进 AdGuard Home 的 DNS 重写、同步到自有域名的解析记录。

            - **测速**：官方地址段随机采样 + 多源聚合 → TCP 筛延迟 → 反代验证（真实 HTTPS + TLS）
              → 真实带宽测速。内置 Cloudflare 官方 IPv4 段快照，第三方源全挂也能跑出结果。
            - **AdGuard Home**：把最优 IP 写进 DNS 重写表，局域网设备自动走这条线。
            - **DDNS**：Cloudflare / 阿里云 / 腾讯云 DNSPod / 华为云 四家可选，
              记录类型可选 A（IPv4）或 AAAA（IPv6），
              只写最快那条、或者按排名一次写前 N 条（条数自己定），TTL 和云朵开关都能设。
            - **后台**：`http://飞牛IP:端口`，端口在安装向导里填（留空 = 8080），
              配置全在界面里填，不用编辑任何文件。

            本 Release 仅提供飞牛应用安装包 `.fpk`。
            Docker 镜像（amd64/arm64）已推送至 DockerHub：`s71557/cf-ddns-sidecar`。

            ### v1.7.0：IPv6 优选打通，可以写进 AAAA 了

            这一版把 IPv6 从「只探测、只在界面上显示」推到「真正能用」：

            - **IPv6 优选接入测速主流程**：一轮测速里先测 IPv4、再测 v6，两套结果各自落盘、互不覆盖。
              开关就是「有没有填 v6 段链接」——没填完全不跑，行为和以前一模一样。
            - **DDNS 支持 AAAA**：域名解析页多了「记录类型」下拉（A / AAAA）。选 AAAA 就写 v6 测出来的地址，
              四家服务商（Cloudflare / 阿里云 / DNSPod / 华为云）都支持。写 A 不会碰 AAAA，写 AAAA 也不会碰 A。
            - **AdGuard 同时容纳两族**：重写表里同一个域名可以同时有 IPv4 和 IPv6 答案，
              家里有 v6 的设备走 v6、没有的自动回落 v4。

            同时修掉 v1.6.9 暴露出来的两个问题：

            - v6 的可用性检查会把所有节点误判成「直连」并打一条红字错误——IPv6 没有 NAT，
              服务端看到的客户端地址本来就是本机公网 v6，所以「地址相同=直连」这条判据在 v6 下必然误杀。
              现在这个比对只在 IPv4 下做（v4 有 NAT，走节点才会看到不同地址）。
            - 采样量太小：原来「总数 600 按段平分」，填 97 个段时每段只剩 6 个，很难捞出可用节点。
              改成每段固定 30 个，97 段约 2900 个候选；探测总时限相应从 3 分钟放宽到 6 分钟。

            **一个要说清楚的取舍**：域名解析一次只同步一族。选了 AAAA 之后，这个域名下已有的 A 记录
            不会再自动更新（它不会被删掉，但会停在最后一次写入的地址）。
            想 A 和 AAAA 同时自动更新，目前还没有对应选项。

            装完后原有功能、数据、配置位置都与 v1.6.9 完全一致。
          files: |
            dist-fpk/*.fpk
          fail_on_unmatched_files: true
