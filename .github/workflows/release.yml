name: Build & Release

# 打 tag（如 v1.0.0）推送后触发：
#   1) buildx 构建 amd64 + arm64 镜像并推送 DockerHub
#   2) 用 fnpack 打包飞牛 .fpk
#   3) 创建 GitHub Release，仅上传 .fpk 文件
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（X.Y.Z）"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cf-ddns-sidecar

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V / 镜像tag: v$V"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        # 发版说明：通用介绍固定，下面 body 只写「当前版」一节。
        # 以后发版只替换 ### 那一节，不要把历史版本堆进来（旧说明留在各自 Release 页）。
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: 安装 fnpack
        env:
          FNPACK_URL: ${{ vars.FNPACK_URL }}
        run: |
          set -e
          URL="${FNPACK_URL:-https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64}"
          echo "下载 fnpack: $URL"
          curl -fsSL "$URL" -o fnpack || {
            echo "::error::fnpack 下载失败。请在仓库 Settings → Variables 设置 FNPACK_URL 为官方 static2.fnnas.com 直链。"
            exit 1
          }
          # 校验是真实 Linux ELF 二进制，防止下载到 HTML 错误页
          file fnpack | grep -q "ELF" || {
            echo "::error::fnpack 不是有效的 Linux 可执行文件（非 ELF），请检查 FNPACK_URL。"
            exit 1
          }
          chmod +x fnpack
          ./fnpack build --help

      - name: 打包飞牛 FPK
        env:
          DOCKERHUB_REPO: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.ver.outputs.tag }}
          FPK_VERSION: ${{ steps.ver.outputs.version }}
          FNPACK_BIN: ${{ github.workspace }}/fnpack
        run: python3 scripts/build_fpk.py

      - name: 列出产物
        run: ls -lh dist-fpk/

      - name: 创建 GitHub Release 并仅上传 FPK
        uses: softprops/action-gh-release@v2
        with:
          # 用已解析的 tag（vX.Y.Z），确保 workflow_dispatch 手动触发时
          # 不会把 Release 错误地挂到分支名上。
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "v${{ steps.ver.outputs.version }}"
          body: |
            ## Cloudflare 优选 IP + AdGuard Home + DDNS（飞牛 fnOS）

            一个容器、一个后台，搞定三件事：测出你家网络**真能连上**的最快 Cloudflare 节点、
            写进 AdGuard Home 的 DNS 重写、同步到自有域名的解析记录。

            - **测速**：官方地址段随机采样 + 多源聚合 → TCP 筛延迟 → 反代验证（真实 HTTPS + TLS）
              → 真实带宽测速。内置 Cloudflare 官方 IPv4 段快照，第三方源全挂也能跑出结果。
            - **AdGuard Home**：把最优 IP 写进 DNS 重写表，局域网设备自动走这条线。
            - **DDNS**：Cloudflare / 阿里云 / 腾讯云 DNSPod / 华为云 四家可选，
              记录类型可选 A（IPv4）、AAAA（IPv6）、或者两者都写，
              只写最快那条、或者按排名一次写前 N 条（条数自己定），TTL 和云朵开关都能设。
            - **后台**：`http://飞牛IP:端口`，端口在安装向导里填（留空 = 8080），
              配置全在界面里填，不用编辑任何文件。

            本 Release 仅提供飞牛应用安装包 `.fpk`。
            Docker 镜像（amd64/arm64）已推送至 DockerHub：`s71557/cf-ddns-sidecar`。

            ### v1.7.4：备份不再漏项，AdGuard 也不再动别人的规则

            这一版修的都是「界面说成功、实际丢了东西」那一类：

            **① 备份会静静少六项。** 之前导出的备份里没有「记录类型」「IPv6 段链接」「同步几条
            IP」「橙云开关」「TTL」「每个域名的包含子域」。最要命的是记录类型：换机恢复之后它
            悄悄变回 A，v6 记录就再也不写了，而界面只说「已恢复」。现在六项都在；导入之后页面上
            还留一块明细，明说「已按文件恢复 N 项」和「这 N 项文件里没有，保持了原来的值」——
            拿老备份导入也不会把新设置冲成空白。

            **② AdGuard 的重写表原来每轮都被清空重建。** 你自己在 AdGuard 后台加的规则会跟着没了，
            而日志只写「已写入 AdGuard：N 条」。现在只动「要加速的域名」里的那些：答案已经对的保持
            原样、不对的才改、缺的才补，别人的记录一条都不碰；顺带也没有了「删光和重建之间重写表
            是空的」那段空窗。点「看看现在写了哪几条」会标三种状态：保留 / 会被改掉 / 不归这个程序管。
            从域名列表里删掉一个域名时，它在 AdGuard 上留下的旧记录也会一起清掉。

            **顺手修的两处**：保存密钥不再整份重写 `ddns.env`（你自己写的注释、以及被注释掉的备用
            令牌原来一保存就没了）；改密钥时把旧令牌注释掉、在下面填新的——原来生效的仍是旧令牌，
            现在按文件语义取最后一行。

            **装完要留意的两点**：① 这一版之后第一次测速会真正开始「不清别人的规则」，如果你
            AdGuard 里原来有自己加的、恰好和某个「要加速的域名」同名的记录，那次会被覆盖（同一个
            域名只能归一个人管，AdGuard 的重写记录里没有「谁写的」这个字段）；② 你手里那份旧备份
            即使程序修好了也只能恢复 9 项——它生成时就没写那六项，重新导出一份才完整。
          files: |
            dist-fpk/*.fpk
          fail_on_unmatched_files: true

      # 发完顺手把旧版本清掉，只留最近 3 个。
      #
      # 为什么放进工作流而不是手工清：2026-11-18 手工清过一次（删了 22 个 Release +
      # 23 个 tag），但每发一版就又攒一个，迟早还得再清一遍。规则是确定的
      # （「只留最近 3 个」），没有理由每次都靠人记着。
      #
      # 为什么 continue-on-error：这一步是收尾杂活，失败不应把一次成功的发版
      # 标成失败——那会让人以为包没打出来。失败时这一步本身仍然显示为失败，
      # 看得到，不会静默。
      - name: 清理旧 Release（只留最近 3 个）
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // 只动「形如 vX.Y.Z 的正式发布」。draft、prerelease、以及别的命名
            // 的 tag 一概不碰——宁可少删，不能误删。
            //
            // 排序按语义化版本比数字，不是比字符串：字符串比会把 v1.10.0 排到
            // v1.9.0 后面，那样被删掉的恰好是更新的那个。
            const KEEP = 3;
            const currentTag = '${{ steps.ver.outputs.tag }}';

            const parse = (t) => {
              const m = /^v(\d+)\.(\d+)\.(\d+)$/.exec(t || '');
              return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
            };
            const cmpDesc = (a, b) => (b[0] - a[0]) || (b[1] - a[1]) || (b[2] - a[2]);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const all = await github.paginate(
              github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const plain = all.filter((r) => !r.draft && !r.prerelease && parse(r.tag_name));
            plain.sort((a, b) => cmpDesc(parse(a.tag_name), parse(b.tag_name)));

            // 无条件保住刚发的这一版。万一以后给老版本补发（比如给 v1.6.x 出个
            // 修复），它按版本号排不进前 3，不能被自己的清理逻辑当场删掉。
            const keep = new Set(plain.slice(0, KEEP).map((r) => r.tag_name));
            if (currentTag) keep.add(currentTag);

            const doomed = plain.filter((r) => !keep.has(r.tag_name));
            core.info(`正式 Release 共 ${plain.length} 个；保留 ${[...keep].join(', ') || '(无)'}；待删 ${doomed.length} 个`);
            if (doomed.length === 0) {
              core.info('没有需要清理的');
              return;
            }

            for (const r of doomed) {
              core.info(`删除 Release ${r.tag_name}（id ${r.id}，附件 ${r.assets.length} 个）`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: r.id });
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${r.tag_name}` });
                core.info(`  已删 tag ${r.tag_name}`);
              } catch (e) {
                // Release 删了、tag 没删掉不是致命的，但得说一声：下次给同一个
                // 版本号发版会撞上已存在的 tag。
                core.warning(`  删 tag ${r.tag_name} 失败（Release 已删）：${e.message}`);
              }
            }
            core.info(`清理完成，删掉 ${doomed.length} 个旧版本`);
