name: Build & Release

# 打 tag（如 v1.0.0）推送后触发：
#   1) buildx 构建 amd64 + arm64 镜像并推送 DockerHub
#   2) 用 fnpack 打包飞牛 .fpk
#   3) 创建 GitHub Release，仅上传 .fpk 文件
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（X.Y.Z）"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cf-ddns-sidecar

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V / 镜像tag: v$V"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: 安装 fnpack
        env:
          FNPACK_URL: ${{ vars.FNPACK_URL }}
        run: |
          set -e
          URL="${FNPACK_URL:-https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64}"
          echo "下载 fnpack: $URL"
          curl -fsSL "$URL" -o fnpack || {
            echo "::error::fnpack 下载失败。请在仓库 Settings → Variables 设置 FNPACK_URL 为官方 static2.fnnas.com 直链。"
            exit 1
          }
          # 校验是真实 Linux ELF 二进制，防止下载到 HTML 错误页
          file fnpack | grep -q "ELF" || {
            echo "::error::fnpack 不是有效的 Linux 可执行文件（非 ELF），请检查 FNPACK_URL。"
            exit 1
          }
          chmod +x fnpack
          ./fnpack build --help

      - name: 打包飞牛 FPK
        env:
          DOCKERHUB_REPO: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.ver.outputs.tag }}
          FPK_VERSION: ${{ steps.ver.outputs.version }}
          FNPACK_BIN: ${{ github.workspace }}/fnpack
        run: python3 scripts/build_fpk.py

      - name: 列出产物
        run: ls -lh dist-fpk/

      - name: 创建 GitHub Release 并仅上传 FPK
        uses: softprops/action-gh-release@v2
        with:
          # 用已解析的 tag（vX.Y.Z），确保 workflow_dispatch 手动触发时
          # 不会把 Release 错误地挂到分支名上。
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "v${{ steps.ver.outputs.version }}"
          body: |
            ## Cloudflare 优选 IP + AdGuard Home + DDNS（飞牛 fnOS）

            一个容器、一个后台，搞定三件事：测出你家网络**真能连上**的最快 Cloudflare 节点、
            写进 AdGuard Home 的 DNS 重写、同步到自有域名的解析记录。

            - **测速**：官方地址段随机采样 + 多源聚合 → TCP 筛延迟 → 反代验证（真实 HTTPS + TLS）
              → 真实带宽测速。内置 Cloudflare 官方 IPv4 段快照，第三方源全挂也能跑出结果。
            - **AdGuard Home**：把最优 IP 写进 DNS 重写表，局域网设备自动走这条线。
            - **DDNS**：Cloudflare / 阿里云 / 腾讯云 DNSPod / 华为云 四家可选，
              只写最快那条、或者按排名一次写前 N 条（条数自己定），TTL 和云朵开关都能设。
            - **后台**：`http://飞牛IP:端口`，端口在安装向导里填（留空 = 8080），
              配置全在界面里填，不用编辑任何文件。

            本 Release 仅提供飞牛应用安装包 `.fpk`。
            Docker 镜像（amd64/arm64）已推送至 DockerHub：`${{ env.IMAGE_NAME }}`。

            ### v1.4.1：修掉「备份目录在，但写不进去」

            v1.4.0 装完之后，运行日志第一屏出现了这么一行：

            ```
            [警告] 备份目录 /app/backup 在，但容器里写不进去（权限或只读挂载）
            ```

            一半是好消息，一半是坏消息。

            **好消息**：前半句「备份目录在」证明**软链那套方案是通的**——docker 确实
            跟着符号链接走到了你存储盘上的那个目录。这一点之前一直没能验证。

            **坏消息**：位置对了，但程序写不进去。根因是权限——那个目录可能是 root 建的
            （上一版留下的、或者平台建的），而程序是以普通用户（uid 1000）跑的。容器的
            启动脚本从 v1.2.0 起就只给**数据目录**改属主（当初是为了不再出现
            `permission denied` 保存失败），**备份目录从来没管过**；它的权限原本指望飞牛的
            安装脚本去改，可那个脚本是普通用户跑的，碰上 root 的目录 chown/chmod 两条路
            都走不通。于是就成了「目录明明在、就是写不进去」。

            v1.4.1 只改一处：容器启动时以 root 把**备份目录的属主也交给程序用户**，和数据
            目录同一套做法。**备份里那些文件的权限刻意不动**（`config.json` 还是 0600、
            其他还是 0644）——那是配置副本，里面是密钥，不需要放宽。

            装完看日志第一屏，这一行应该变成：

            ```
            [信息] 备份目录 /app/backup 可用：共 N 份，最新 20261117-190500
            ```

            （一次都没保存过的新装机会是「可用，目前是空的」。）不再是「写不进去」，
            也就不用再把它发我了。

            ### v1.4.0：把「正本」也搬出去——从此升级不用再捡配置

            v1.3.2 装完之后后台**还是空的**。这次不猜了，直接说结论：

            前面三版（v1.1.1 / v1.3.1 / v1.3.2）搬的全是**备份**，而配置本身一直住在
            `/var/apps/cf-ddns-sidecar/share/cf-ddns-sidecar/data`。飞牛升级时删的正是
            `/var/apps/cf-ddns-sidecar` 这一整层。于是每装一次新版，正本都没了，只能靠备份
            「捡回来」——捡得回来算运气好，捡不回来就得重新申请令牌、重填一遍密钥。

            **备份是出事之后的补救，把正本放到平台不认识的地方才是根治。**

            v1.4.0 起，数据和备份一样放在你的存储盘根目录下：

            | | 以前 | v1.4.0 |
            |---|---|---|
            | 配置正本 | `/var/apps/cf-ddns-sidecar/share/cf-ddns-sidecar/data` | **`/vol1/cf-ddns-sidecar-data`** |
            | 备份 | `/vol1/cf-ddns-sidecar-backup` | 不变（v1.3.2 已搬） |

            `/var/apps/cf-ddns-sidecar-data` 只是指向它的快捷方式，容器里看到的仍然是
            `/app/data`，程序一行都没改。

            **老用户的数据会自动搬过去**，一个文件都不落，不用你动手。判断有没有搬成功，
            看运行日志里有这么一行：

            ```
            [cf-ddns-sidecar] 数据目录已搬到存储卷：... -> /vol1/cf-ddns-sidecar-data
            ```

            **万一搬不动**（存储盘根目录不让写、或者你的机器布局比较特殊），程序会
            **留在原地照常跑**——宁可少一层保护，也绝不让应用起不来。那种情况日志会写
            「数据目录留在 `/var/apps/cf-ddns-sidecar-data`（升级时会被平台删掉，但有备份兜底）」。

            升级前那套「备份 + 自动恢复」**一行都没删**，继续当最后一道保险。

            ### 升级前请看

            - **从任何旧版本升上来，配置都会自动搬到你的存储盘上**，不用你动手。
            - **装完请看一眼运行日志第一屏**，找这两行：
              · 「数据目录已搬到存储卷：…」（或「数据目录：… -> …」）
              · 「备份目录 … 可用：共 N 份，最新 …」

              两行都在，说明这套机制通了。哪行没出现、或者写着「不存在」「留在了」，
              请把那一行发给我。**「写不进去」这一种是 v1.4.0 的已知问题，v1.4.1 已修**——
              装的是 v1.4.1 却还写着「写不进去」，说明那个目录挂成了只读，或者落在连容器内
              root 都改不动的文件系统上（比如开了 root-squash 的 NFS），把那一行发我。
            - **卸载应用不会删你的数据**（v1.1.1 起也不会删存储盘根下这两个文件夹）。
              想彻底清干净要自己去「文件管理」的存储空间根目录删掉
              `cf-ddns-sidecar-data` 和 `cf-ddns-sidecar-backup`。
            - 从 v1.1.0 及更早往上升：先看下面 v1.1.1 那节，那一版才修掉
              「卸载脚本删数据」。

            ### 历史版本要事（v1.3.2）

            把备份的生成权从「飞牛升级时执行的那个脚本」收回到程序自己手里
            （真机证明那个脚本可能压根不执行，于是「自动恢复」手里没东西可捡），
            并把备份实体搬到存储盘根下（`/vol1/cf-ddns-sidecar-backup`）。
            同一版还去掉了「登录密码太短」的常驻黄条。

            ### 历史版本要事（v1.3.1）

            把备份从应用目录**里面**搬到应用目录的**兄弟**（`/var/apps/cf-ddns-sidecar-backup`），
            并让程序在启动时发现「数据目录空了、备份还在」就自己恢复，恢复完在顶上挂红条。
            当时以为这样就能扛住覆盖升级了，真机验证后发现还差两层：
            兄弟目录仍在 `/var/apps` 下，而且那一次宿主机脚本根本没执行。

            ### 历史版本要事（v1.3.0）

            v1.3.0 加了三个域名解析相关的设置，都还能用：一次按排名写多个 IP
            （「填几条，这个域名下就只留几条」，是**对齐**不是追加；测不出 IP 时
            一条都不删）、记录缓存时间 TTL 自己填、Cloudflare 云朵开关（默认关、
            建议保持关，开了就不指向优选 IP 了）。

            ### 历史版本要事（v1.1.1）

            v1.1.1 修了一个会弄丢全部配置的问题：卸载脚本里有一段 `rm -rf` 数据目录
            （本意是卸载后别留空文件夹），而飞牛的升级流程在部分版本上走「卸旧装新」，
            于是它在升级时被执行了。三处一起改才闭环：卸载不再删数据、
            升级前备份到数据目录**同级**（整层被删也能活）、程序自己留 `.bak` 并能恢复。
            已被清空的配置无法找回，需要重新填一次。

            ### 历史版本要事（v1.1.0，放公网前必看）

            如果你打算把这个后台放到公网（Cloudflare Tunnel 或反向代理），
            v1.1.0 堵上了三个会变成漏洞的地方：登录失败限流（连错 5 次锁 5 分钟，
            之后每轮翻倍、最长 1 小时）、堵住候选列表接口的「本机免登录」口子
            （挂上隧道后所有请求在程序眼里都来自本机）、补上安全响应头
            （**刻意不加 `X-Frame-Options`**，因为飞牛桌面用 iframe 嵌入本后台，
            禁了会让图标点开一片白）。

            > 附带：会话 Cookie 的 `Secure` 改为只在 HTTPS 下添加。HTTP 下带这个标记
            > 浏览器会直接丢弃，表现为「提示登录成功，但下一个请求又说未登录」。

            ### 安装

            1. 下载下方 `.fpk`；
            2. 飞牛桌面 → 应用中心 → 右上角设置 → **手动安装应用** → 选择该文件；
            3. **安装过程中会弹出「后台访问」向导**：填后台端口（留空 = 8080）+ 登录密码
               （留空则自动生成并打印在运行日志里）。
               域名、服务商和密钥装完在后台界面里填——那里的表单会显示当前值，不会误覆盖。

            ### 端口改了但点图标打不开？

            v1.0.1 起已修：桌面入口的端口改成占位符，会自动跟随你设的值；
            更老的飞牛版本则由程序启动时兜底纠正一次。若仍出现，重启一次应用即可。

            ### 如果你装过更早的内测版

            请**先彻底卸载再重新安装**。早期版本存在「安装时填的端口/密码不生效」的问题，
            修复已经内置在这一版里，重装一次即可彻底干净。卸载会一并清掉容器、镜像和数据目录。

            > 版本号说明：早期发布过一段 `3.0.x` 的内测版本号，现已全部撤下并重置。
            > 现在按 `1.0.x → 1.1.x` 正常递增——数字比 `3.0.x` 小，但内容更新。

            > 测速必须直连。程序已强制直连（清空所有 `*_PROXY`）。
            > 若路由器做了全局透明代理，需给 NAS 放行直连，否则测速结果会失真。
          files: |
            dist-fpk/*.fpk
          fail_on_unmatched_files: true
