services:
  # 单个容器装下全部功能：测速（cfnb 引擎）+ AdGuard Home 重写 + 域名解析（DDNS）
  # + 统一后台界面。不再有第二个进程、第二个端口、第二个数据目录。
  #
  # 刻意不使用 env_file：飞牛在安装阶段就校验 env_file 是否存在，
  # 而配置文件要等应用首次启动才生成，会直接导致安装失败。
  # 配置由程序自己读写 /app/data 下的 config.json 与 ddns.env。
  cf-ddns-sidecar:
    image: {{DOCKERHUB_REPO}}:{{IMAGE_TAG}}
    container_name: cf-ddns-sidecar
    restart: unless-stopped
    # 用 host 网络：端口由程序按 ddns.env 的 CFDDNS_PORT 自己监听，
    # 不用做端口映射，改端口不需要重建容器。
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      # v1.5.1：把「数据目录在宿主机上的真实路径」告诉程序。
      #
      # 容器里只看得到 /app/data，看不见它对应宿主机哪个目录；而飞牛官方文档里
      # 那个漂亮的 `var -> /vol{n}/@appdata/<app>` 是宿主机视角，容器进程读不到
      # （环境变量 TRIM_PKGVAR 只发给宿主机的生命周期脚本，不发给容器）。
      # 不传这个值，日志就只能含糊地说「容器内 /app/data」，用户还得去文件管理器翻。
      CFDDNS_DATA_HOST: "${TRIM_PKGVAR:-}"
      # v1.4.x 用的旧数据目录。换到官方位置后它不会被自动删（故意留着好回退），
      # 程序在恢复日志里会点名它，提醒「确认没问题后可以自己删」。
      CFDDNS_LEGACY_HOST: "/var/apps/cf-ddns-sidecar-data"
      # 下面两个 ${wizard_xxx} 是飞牛官方唯一保证能把「安装向导里填的值」送进容器的通道。
      #
      # 为什么只能这么传：飞牛不是执行 `docker compose up`，而是通过 Docker 接口
      # 建容器，并且在 install_callback 之前就已经把容器建成跑起来了。所以在回调
      # 脚本里改文件再重启，时机上永远晚一步。飞牛唯一保证会做的，是建容器之前
      # 对 compose 里的 ${wizard_xxx} 做变量替换。占位符不写，值就到不了。
      #
      # 值为空时（用户在向导里留空、或用户自己用 docker compose up 部署）就是空串，
      # 程序会当作「没设置」忽略掉。
      #
      # 这两个只当「种子」用：程序只在第一次启动时把它们落到 ddns.env /
      # dashboard-password，之后一律以文件为准。否则你在「应用设置」里改了端口或
      # 密码，重启后又被这两个固定不变的环境变量盖回去，就成了另一个坑。
      CFDDNS_PORT: "${wizard_port:-}"
      CFDDNS_PASSWORD_SEED: "${wizard_dashboard_password:-}"
    volumes:
      # 数据目录 —— v1.5.1 起正式改用飞牛官方的运行数据目录。
      #
      # 官方文档（应用框架 / 环境变量）写明：安装后 /var/apps/<app>/ 下由平台
      # 自动建好 `var -> /vol{n}/@appdata/<app>`，配套变量叫 TRIM_PKGVAR，并明确
      # 要求「用这些变量，不要硬编码路径」。
      #
      # 所以「把数据放到存储卷上」根本不用我们自己 mkdir /vol1/... 再建软链——
      # v1.3.2～v1.4.1 那套自造 <app>-data 把官方机制绕开了，又拿普通用户去
      # root 属主的 /vol1 里建目录，必然失败，而且失败还被 2>/dev/null 吞掉，
      # 于是每一版都「以为搬了、其实没搬」。
      #
      # v1.5.0 探针已在真机验证两件事：这个变量**确实**会被替换（日志里
      # DATA_ROOT 变成了 /vol1/@appdata/cf-ddns-sidecar），并且容器用户
      # （uid 1000）**确实**能写 @appdata。
      #
      # 两个细节是刻意这么写的：
      #   ① 用 `:-` 给默认值：万一某个平台版本没把 TRIM_PKGVAR 传进来，挂载源
      #      原样退回旧路径，老数据照旧读得到——拿不到变量也不会让人
      #      「配置看起来丢了」。
      #   ② **不加 `/data` 后缀**：加了之后默认值就变成旧路径下的子目录，
      #      老文件在父目录里、程序却去读子目录，正好制造出「配置丢了」的假象。
      #
      # 容器里看到的路径仍是 /app/data，程序读写的位置一行没改。
      - "${TRIM_PKGVAR:-/var/apps/cf-ddns-sidecar-data}:/app/data"
      # v1.5.1：把 v1.4.x 的旧数据目录**只读**挂进来，让程序启动时自己搬。
      #
      # 换了挂载源，老用户的配置就落在旧目录里、新目录天然是空的。备份那套虽然
      # 能把它捡回来，但「捡」依赖备份存在、且会让用户看到「恢复过」的红条；
      # 这里搬一次才是真正的无缝升级。
      #
      # 为什么搬迁必须在容器里的程序做：真机日志证明，飞牛对 Docker 应用做
      # 覆盖升级时**不执行任何宿主机生命周期脚本**（cmd/main 和 upgrade_init
      # 都没跑）。写在 cmd/* 里等于写在永远不会被调用的地方。
      #
      # 只读是刻意的：搬迁逻辑就算有 bug，也绝不可能破坏旧目录里那份唯一
      # 还活着的配置。旧目录搬完**不删**，留作回退点。
      #
      # 目录不存在时 docker 会自动建一个空目录（root 所有）。容器里读得到、
      # 里面没有 config.json，程序当作「没有旧数据」直接跳过，不会误判。
      - "/var/apps/cf-ddns-sidecar-data:/app/legacy-data:ro"
      # 备份目录 —— v1.6.3 起搬到官方建议的位置：数据根目录下的 backup 子目录。
      #
      # 官方对账 A2：官方没有「独立备份目录」这个概念，`var` 下自建子目录即可。
      # 所以现在备份和数据住在同一个根下面：
      #   容器里 /app/backup  ←→ 宿主机 ${TRIM_PKGVAR}/backup
      #   真机上就是 /vol1/@appdata/cf-ddns-sidecar/backup
      #
      # **必须知道这条代价**（选这个方案时已经确认过）：
      # 备份从「应用目录的兄弟」变成了「数据目录内部」，卸载时数据和备份
      # 会同归于尽。以前 /var/apps/<app>-backup 是能活过卸载的。
      # 换来的是符合官方布局、少一层自造目录。升级场景不受影响——@appdata
      # 在覆盖升级时不会被删（v1.5.1 起两次实测）。
      #
      # 默认值刻意和数据挂载保持同一个根（/var/apps/<app>-data），这样
      # 「拿不到 TRIM_PKGVAR」时两者仍然是同一个父目录下的兄弟关系，
      # 不会出现「数据在新位置、备份在旧位置」这种只搬了一半的状态。
      - "${TRIM_PKGVAR:-/var/apps/cf-ddns-sidecar-data}/backup:/app/backup"
      # v1.6.3：v1.6.2 及更早的备份在应用目录的**兄弟**目录，这里只读挂进来，
      # 让容器启动时自己搬（容器入口以 root 跑，宿主机脚本不一定跑——见下面
      # legacy-data 那段注释里写的真机证据）。
      #
      # 只读 + 搬完不删：老位置留作回退点，和旧数据目录同一个原则。
      # 目录不存在时 docker 会建一个空目录，容器里看到空的就是「没有旧备份」，
      # 直接跳过，不会误判。
      - "/var/apps/cf-ddns-sidecar-backup:/app/legacy-backup:ro"
