services:
  # 单个容器装下全部功能：测速（cfnb 引擎）+ AdGuard Home 重写 + 域名解析（DDNS）
  # + 统一后台界面。不再有第二个进程、第二个端口、第二个数据目录。
  #
  # 刻意不使用 env_file：飞牛在安装阶段就校验 env_file 是否存在，
  # 而配置文件要等应用首次启动才生成，会直接导致安装失败。
  # 配置由程序自己读写 /app/data 下的 config.json 与 ddns.env。
  cf-ddns-sidecar:
    image: {{DOCKERHUB_REPO}}:{{IMAGE_TAG}}
    container_name: cf-ddns-sidecar
    restart: unless-stopped
    # 用 host 网络：端口由程序按 ddns.env 的 CFDDNS_PORT 自己监听，
    # 不用做端口映射，改端口不需要重建容器。
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      # 下面两个 ${wizard_xxx} 是飞牛官方唯一保证能把「安装向导里填的值」送进容器的通道。
      #
      # 为什么只能这么传：飞牛不是执行 `docker compose up`，而是通过 Docker 接口
      # 建容器，并且在 install_callback 之前就已经把容器建成跑起来了。所以在回调
      # 脚本里改文件再重启，时机上永远晚一步。飞牛唯一保证会做的，是建容器之前
      # 对 compose 里的 ${wizard_xxx} 做变量替换。占位符不写，值就到不了。
      #
      # 值为空时（用户在向导里留空、或用户自己用 docker compose up 部署）就是空串，
      # 程序会当作「没设置」忽略掉。
      #
      # 这两个只当「种子」用：程序只在第一次启动时把它们落到 ddns.env /
      # dashboard-password，之后一律以文件为准。否则你在「应用设置」里改了端口或
      # 密码，重启后又被这两个固定不变的环境变量盖回去，就成了另一个坑。
      CFDDNS_PORT: "${wizard_port:-}"
      CFDDNS_PASSWORD_SEED: "${wizard_dashboard_password:-}"
    volumes:
      # 数据目录 **双向**挂载。
      #
      # 这个路径本身通常是一个**指向存储卷的符号链接**（cmd/main 每次启动时安置，
      # 链到 /volN/cf-ddns-sidecar-data），和下面备份那条是同一套机制。
      #
      # 为什么 v1.4.0 要把数据也搬出去——这是第四次搬同一个东西，前三次都只搬了
      # 备份、没搬正本，所以每装一次新版就丢一次配置：
      #   · v1.0.x～v1.1.0：数据在 /var/apps/<app>/share/<app>/data，整层被删就没；
      #   · v1.1.1：只加了「升级前备份」，备份也在这层里面，跟着一起塌；
      #   · v1.3.1：备份搬到应用目录外，但真机证明 upgrade_init 根本没被执行；
      #   · v1.3.2：程序自己备份 + 备份链到存储卷，备份活下来了，**但正本还在原地**。
      # 结果是：每次升级都要用备份「捡回来」，而这本来是根本不该发生的事。
      # 备份是事故之后的补救，把正本放到平台不认识的地方才是根治。
      #
      # 注意：容器里看到的路径仍然是 /app/data，程序一行都不用改。
      - "/var/apps/cf-ddns-sidecar-data:/app/data"
      # 备份目录，**双向**挂载（v1.3.2 起从只读改的）。
      #
      # 这个路径本身通常是一个**指向存储卷的符号链接**（cmd/main 每次启动时安置，
      # 链到 /volN/cf-ddns-sidecar-backup）。docker 会顺着软链找到真实目录，所以
      # 容器里看到的还是 /app/backup，程序不用关心它到底在哪。
      #
      # 为什么一路往「更外面」搬，三次都是同一个原因——备份不能放在会被删的那一层：
      #   · v1.0.x：跟数据放一起，整个数据目录被清就没；
      #   · v1.1.1：挪到 share/<app>-backup-<时间>/，仍在应用目录里面，整层被删跟着没；
      #   · v1.3.1：挪到 /var/apps/<app>-backup，是应用目录的兄弟，但还在 /var/apps 下；
      #   · v1.3.2：链到 /volN 上，连 /var/apps 整个被清也活得下来。
      #
      # 为什么从只读改可写：v1.3.1 只有宿主机脚本 cmd/upgrade_init 会往里写，
      # 而真机验证明明升级了、脚本却没跑（备份目录是空的），于是「自动恢复」
      # 手里没东西可捡、一条提示都没出。v1.3.2 起程序自己每次保存配置后也往
      # 这里备一份。因此容器用户（uid 1000）必须对这个目录有写权限，
      # 具体由 cmd/main 在启动前 chown 好。
      #
      # 目录不存在时 docker 会自动建一个空的，不会导致启动失败。
      - "/var/apps/cf-ddns-sidecar-backup:/app/backup"
